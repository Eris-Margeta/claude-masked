name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Adapter tests
        run: python3 test_translate.py
      - name: Syntax
        run: python3 -m py_compile claude_masked.py auth.py models.py stream_adapter.py
